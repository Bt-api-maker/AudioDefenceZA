name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [thai-localization, auto-aim]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      # With the AD_KEYSTORE_B64 secret (the signing key, base64) the APK is the release build, signed with the
      # same key every time, so each one installs over the last.  Without it, a debug build as before.
      - name: Build APK
        working-directory: android
        env:
          KEY_B64: ${{ secrets.AD_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            AD_KEYSTORE="$RUNNER_TEMP/release.p12" gradle assembleRelease -PbuildPython="$(which python)" --no-daemon
            echo "VARIANT=release" >> "$GITHUB_ENV"
          else
            gradle assembleDebug -PbuildPython="$(which python)" --no-daemon
            echo "VARIANT=debug" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: AudioDefence-Android-${{ env.VARIANT }}
          path: android/app/build/outputs/apk/${{ env.VARIANT }}/*.apk
